name: Release

# Publishes when a merge to master changes the version in package.json, then tags that commit
# and opens a GitHub Release. Pushes that do not change the version are a no-op.
#
# Uses npm trusted publishing (OIDC): no npm token is stored in this repository, and provenance
# attestations are generated automatically.
#
# PREREQUISITE (one-time, cannot be scripted): configure a Trusted Publisher for
# @fordefi/crypto-address-validator-ts on npmjs.com — provider GitHub Actions, this repository,
# workflow `release.yml`. Configurations created after 2026-05-20 must also select an allowed
# action; select `npm publish`. Until that exists, the publish step fails.

on:
  push:
    branches: [master]

permissions:
  id-token: write   # OIDC auth to npm
  contents: write   # create the tag and the GitHub Release

# Never cancel a release part-way through a publish; serialise them instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # GitHub-hosted only — trusted publishing does not support self-hosted runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # trusted publishing needs npm >= 11.5.1 and Node >= 22.14
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Check whether this version is already on the registry
        id: check
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published — nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on the registry — releasing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm ci --ignore-scripts

      # `prepublishOnly` runs the whole gate (both test passes, publint, attw, the pack smoke
      # test) before anything is uploaded, so it is not repeated here.
      - if: steps.check.outputs.publish == 'true'
        run: npm publish

      # After the publish, so a tag can never point at a version that failed to ship.
      - name: Tag the commit and open a GitHub Release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.check.outputs.version }}" --target "$GITHUB_SHA" --generate-notes
